# Periodically sync upstream ccch1mneyyy/dsh-Go main into this fork's main.
# If upstream has new commits and merges cleanly, push to main and chain into
# Fork APK via workflow_call (GITHUB_TOKEN pushes do not trigger on: push).
name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    # Twice daily at 08:00 and 20:00 UTC+8 (00:00 and 12:00 UTC).
    - cron: '0 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and merge upstream/main
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git
          git fetch upstream main

          ahead="$(git rev-list --count HEAD..upstream/main)"
          echo "Upstream ahead by $ahead commit(s)."
          if [ "$ahead" -eq 0 ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "licoba"
          git config user.email "19327381+licoba@users.noreply.github.com"

          if ! git merge --no-edit upstream/main; then
            echo "::error::Merge conflict while syncing upstream/main. Please merge manually."
            git status -s
            exit 1
          fi

          if ! git push origin main; then
            echo "::error::Failed to push merged main (upstream may have modified .github/workflows/, which requires manual merge or a PAT with workflow scope)."
            exit 1
          fi

          new_sha="$(git rev-parse HEAD)"
          echo "Merged and pushed main at $new_sha."
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/fork-apk.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    secrets: inherit
