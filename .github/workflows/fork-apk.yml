# Fork-only build of the main branch: an arm64 "side" APK
# (io.github.ccch1mneyyy.dsh_app.test, "DSH Go 测试") that installs next to the
# released app with its own data, so fork features can be tried without
# touching the installed build or its API keys.
#
# The APK and, when the build fails, the tail of the build log are published as
# GitHub Releases: a public download needs no token, and the log is readable
# from outside the runner.
name: Fork APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to checkout and build
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: fork-apk-main
      cancel-in-progress: true
    env:
      FLUTTER_VERSION: 3.47.7
      LOG_TAG: fork-log-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # gradlew is not tracked in this repository; Flutter falls back to gradle on PATH.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Toolchain notes
        run: |
          java -version 2>&1 | head -3
          flutter --version
          gradle --version | sed -n '3,6p'
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Android SDK pieces
        run: |
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # Later steps read local.properties from this, and the runner may not export it.
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sm" ]; then
            yes | "$sm" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
            "$sm" --sdk_root="$sdk" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" || true
          else
            echo "no sdkmanager at $sm; using the direct NDK download"
          fi
          # The pinned NDK the tawcroot build requires, whichever route put it there.
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -f "$ndk/source.properties" ]; then
            echo "NDK 28.2.13676358 missing; fetching r28c"
            curl -fL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
            rm -rf /tmp/ndk-unpack && mkdir -p /tmp/ndk-unpack
            unzip -q /tmp/ndk.zip -d /tmp/ndk-unpack
            if ! { mkdir -p "$sdk/ndk" 2>/dev/null && mv /tmp/ndk-unpack/android-ndk-r28c "$ndk" 2>/dev/null; }; then
              sudo mkdir -p "$sdk/ndk"
              sudo mv /tmp/ndk-unpack/android-ndk-r28c "$ndk"
            fi
          fi
          test -f "$ndk/source.properties"
          grep Pkg.Revision "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          ls "$sdk/ndk"

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-downloads-fork-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-fork-

      - name: Runtime (arm64)
        run: |
          set -o pipefail
          runtime/build-runtime.sh arm64-v8a 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Externalize runtime & speech models (slim APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CACHE_TAG="runtime-cache"
          if ! gh release view "$CACHE_TAG" >/dev/null 2>&1; then
            gh release create "$CACHE_TAG" \
              --prerelease \
              --title "DSH Go Runtime Cache (auto-synced)" \
              --notes "Content-addressed Linux runtime archives and speech ONNX models auto-synced from upstream builds and downloaded on demand by slim Fork APKs."
          fi

          EXISTING_JSON="$(gh release view "$CACHE_TAG" --json assets 2>/dev/null || echo '{"assets":[]}')"
          python3 - "$CACHE_TAG" "$GITHUB_REPOSITORY" "$EXISTING_JSON" <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path

          cache_tag, repo, existing_raw = sys.argv[1], sys.argv[2], sys.argv[3]
          existing_assets = json.loads(existing_raw).get("assets", [])
          existing = {a["name"] for a in existing_assets}
          keep_now = set()

          def upload_if_missing(src: Path, remote_name: str) -> str:
              keep_now.add(remote_name)
              if remote_name in existing:
                  print(f"[slim-apk] already cached: {remote_name}")
              else:
                  staged = Path(os.environ["RUNNER_TEMP"]) / remote_name
                  shutil.copy2(src, staged)
                  print(f"[slim-apk] uploading new asset: {remote_name}")
                  subprocess.run(
                      ["gh", "release", "upload", cache_tag, str(staged), "--clobber"],
                      check=True,
                  )
                  staged.unlink(missing_ok=True)
                  existing.add(remote_name)
              return f"https://github.com/{repo}/releases/download/{cache_tag}/{remote_name}"

          # 1. Externalize Linux runtime rootfs archive(s)
          assets_dir = Path("runtime/out/arm64-v8a/assets/runtime")
          manifest_path = assets_dir / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          schema = manifest.get("schema", 1)

          def publish_runtime(asset_name: str, sha256: str) -> str:
              src = assets_dir / asset_name
              assert src.is_file(), f"missing built runtime archive: {src}"
              if asset_name.endswith(".tar.xz"):
                  stem, ext = asset_name[:-7], ".tar.xz"
              elif asset_name.endswith(".tar.gz"):
                  stem, ext = asset_name[:-7], ".tar.gz"
              else:
                  stem, ext = os.path.splitext(asset_name)
              url = upload_if_missing(src, f"{stem}-{sha256[:12]}{ext}")
              src.unlink()
              return url

          if schema == 1:
              manifest["rootfsUrl"] = publish_runtime(manifest["rootfs"], manifest["rootfsSha256"])
          elif schema == 2:
              for layer_name in ("base", "engine"):
                  layer = manifest["layers"][layer_name]
                  layer["downloadUrl"] = publish_runtime(layer["asset"], layer["sha256"])
          else:
              raise SystemExit(f"unsupported runtime manifest schema: {schema}")

          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"[slim-apk] updated {manifest_path}")

          # 2. Externalize speech ONNX models (silero_vad.onnx + smart-turn-v3.2-cpu.onnx)
          speech_dir = Path("app/android/app/src/main/assets/speech")
          speech_models = {}
          if speech_dir.is_dir():
              for onnx in sorted(speech_dir.glob("*.onnx")):
                  sha = hashlib.sha256(onnx.read_bytes()).hexdigest()
                  remote_name = f"{onnx.stem}-{sha[:12]}{onnx.suffix}"
                  url = upload_if_missing(onnx, remote_name)
                  speech_models[onnx.name] = {
                      "sha256": sha,
                      "bytes": onnx.stat().st_size,
                      "url": url,
                  }
                  onnx.unlink()
              if speech_models:
                  (speech_dir / "manifest.json").write_text(
                      json.dumps({"schema": 1, "models": speech_models}, indent=2, ensure_ascii=False) + "\n",
                      encoding="utf-8",
                  )
                  print(f"[slim-apk] externalized {len(speech_models)} speech ONNX models")

          # 3. Prune old cached assets per prefix, keeping the 3 most recent versions
          refreshed = json.loads(
              subprocess.check_output(["gh", "release", "view", cache_tag, "--json", "assets"], text=True)
          ).get("assets", [])
          by_prefix = {}
          for asset in refreshed:
              name = asset["name"]
              prefix = name.rsplit("-", 1)[0] if "-" in name else name
              by_prefix.setdefault(prefix, []).append(asset)
          for prefix, items in by_prefix.items():
              items.sort(key=lambda a: a.get("updatedAt") or a.get("createdAt") or "", reverse=True)
              for stale in items[3:]:
                  if stale["name"] in keep_now:
                      continue
                  print(f"[slim-apk] pruning old cached asset: {stale['name']}")
                  subprocess.run(
                      ["gh", "release", "delete-asset", cache_tag, stale["name"], "--yes"],
                      check=False,
                  )
          PY

      - name: App dependencies
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$GITHUB_WORKSPACE/app/android/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > "$GITHUB_WORKSPACE/app/android/key.properties" <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build side APK
        run: |
          set -o pipefail
          tooling/build-apk.sh --side --no-companion 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          ls -l app/build/app/outputs/flutter-apk/

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          test -f "$apk"

          app_ver="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' app/pubspec.yaml | head -n1)"
          app_ver="${app_ver:-dev}"
          short_sha="$(git rev-parse --short=7 HEAD)"
          head_subject="$(git log -1 --pretty=%s)"
          head_date="$(git log -1 --pretty=%cs)"
          if [ "${#head_subject}" -gt 72 ]; then
            head_summary="${head_subject:0:69}…"
          else
            head_summary="$head_subject"
          fi

          tag="fork-v${app_ver}-b${GITHUB_RUN_NUMBER}-${short_sha}"
          apk_name="dsh-go-fork-v${app_ver}-b${GITHUB_RUN_NUMBER}-${short_sha}-arm64.apk"
          cp "$apk" "$RUNNER_TEMP/$apk_name"
          sha256="$(sha256sum "$RUNNER_TEMP/$apk_name" | awk '{print $1}')"
          apk_size="$(du -h "$RUNNER_TEMP/$apk_name" | awk '{print $1}')"

          # Old releases may exist as GitHub tags that this clone still needs.
          git fetch --tags --force origin 2>/dev/null || true

          # Latest real APK release (skip build-log prereleases / drafts).
          prev_tag="$(gh release list --limit 40 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | select((startswith("fork-log-") or startswith("side-root-shell-log-") or startswith("jvm-log-")) | not)][0] // ""' || true)"

          # Prefer a tag that resolves in this repo; otherwise fall back.
          if [ -n "$prev_tag" ] && ! git rev-parse -q --verify "refs/tags/${prev_tag}^{}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${prev_tag}:refs/tags/${prev_tag}" 2>/dev/null || prev_tag=""
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## 本次构建"
            echo ""
            echo "- **触发提交**：${head_subject} (\`${short_sha}\`，${head_date})"
            echo "- **流水线**：[Run #${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""

            echo "## 相对上一版"
            echo ""
            if [ -n "$prev_tag" ] && git rev-parse -q --verify "refs/tags/${prev_tag}^{}" >/dev/null 2>&1; then
              total="$(git rev-list --count "${prev_tag}..HEAD")"
              non_merge="$(git rev-list --count --no-merges "${prev_tag}..HEAD")"
              if [ "$total" -eq 0 ]; then
                echo "与上一版 \`${prev_tag}\` 指向同一提交（手动重跑或无新代码）。"
              else
                echo "上一版：\`${prev_tag}\` → 本版：\`${short_sha}\`（共 **${total}** 个提交，其中非 merge **${non_merge}**）"
                echo ""
                # Mainline first (fork merges / direct pushes), then a short non-merge sample.
                echo "### 主线提交"
                echo ""
                git log --first-parent -n 20 --pretty=format:'- %s (`%h`)' "${prev_tag}..HEAD"
                echo ""
                echo ""
                if [ "$non_merge" -gt 0 ]; then
                  echo "### 近期非 merge 提交（最多 20 条）"
                  echo ""
                  git log --no-merges -n 20 --pretty=format:'- %s (`%h`)' "${prev_tag}..HEAD"
                  echo ""
                  echo ""
                fi
                echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${short_sha}"
              fi
            else
              echo "未找到可对比的上一版 tag，改为列出最近提交："
              echo ""
              git log --first-parent -n 15 --pretty=format:'- %s (`%h`)'
              echo ""
            fi

            echo ""
            echo "## 构建信息"
            echo ""
            echo "- **版本**：\`v${app_ver}\`（Run \`#${GITHUB_RUN_NUMBER}\`）"
            echo "- **提交**：\`${short_sha}\`（分支：\`${GITHUB_REF_NAME}\`）"
            echo "- **包名**：\`io.github.ccch1mneyyy.dsh_app.test\`（侧装包，可与正式版共存，固定签名可直接覆盖安装）"
            echo "- **APK 文件**：\`${apk_name}\`"
            echo "- **APK 大小**：${apk_size}"
            echo "- **SHA-256**：\`${sha256}\`"
            echo ""
            echo "## Fork 长期特性"
            echo ""
            echo "- \`android_shell\` 支持 root/su，且命令自动放行（不弹「允许一次 / 本轮允许」）"
            echo "- 手机操控默认免确认；清空默认拒绝列表；安装/权限/安全页不再硬拦"
            echo "- 会话权限默认自动允许（前台与后台静默放行）"
            echo "- 新建模型默认支持文本 + 图片"
          } > "$notes_file"

          release_title="DSH Go Fork v${app_ver} · #${GITHUB_RUN_NUMBER} · ${short_sha} — ${head_summary}"
          aapt2="$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          ver_code=""
          if [ -n "$aapt2" ]; then
            ver_code="$("$aapt2" dump badging "$RUNNER_TEMP/$apk_name" 2>/dev/null | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n1 || true)"
          fi
          ver_code="${ver_code:-$(python3 tooling/build_number.py)}"
          apk_bytes="$(stat -c %s "$RUNNER_TEMP/$apk_name")"
          update_json="$RUNNER_TEMP/update.json"
          python3 - "$update_json" "$app_ver" "$ver_code" "$tag" "$release_title" "$notes_file" "$GITHUB_REPOSITORY" "$apk_name" "$apk_bytes" "$sha256" <<'PY'
          import datetime, json, sys
          from pathlib import Path
          out, app_ver, ver_code, tag, title, notes_path, repo, apk_name, apk_bytes, sha256 = sys.argv[1:11]
          manifest = {
              "schema": 1,
              "version": f"{app_ver}+{ver_code}",
              "tag": tag,
              "title": title,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": Path(notes_path).read_text(encoding="utf-8"),
              "page": f"https://github.com/{repo}/releases/tag/{tag}",
              "assets": {
                  "arm64": {
                      "name": apk_name,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{apk_name}",
                      "size": int(apk_bytes),
                      "sha256": sha256,
                  },
              },
          }
          Path(out).write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          gh release create "$tag" "$RUNNER_TEMP/$apk_name" "$update_json" \
            --latest \
            --title "$release_title" \
            --notes-file "$notes_file"

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/failure.md"
          { echo "构建失败。日志尾部："; echo '```'; tail -c 50000 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(no log)"; echo '```'; } > "$body"
          gh release create "$LOG_TAG" --prerelease --title "build log #${GITHUB_RUN_NUMBER}" --notes-file "$body" || true
