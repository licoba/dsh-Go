# Fork-only build of the main branch: an arm64 "side" APK
# (io.github.ccch1mneyyy.dsh_app.test, "DSH Go 测试") that installs next to the
# released app with its own data, so fork features can be tried without
# touching the installed build or its API keys.
#
# The APK and, when the build fails, the tail of the build log are published as
# GitHub Releases: a public download needs no token, and the log is readable
# from outside the runner.
name: Fork APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      FLUTTER_VERSION: 3.47.7
      LOG_TAG: fork-log-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # gradlew is not tracked in this repository; Flutter falls back to gradle on PATH.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Toolchain notes
        run: |
          java -version 2>&1 | head -3
          flutter --version
          gradle --version | sed -n '3,6p'
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Android SDK pieces
        run: |
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # Later steps read local.properties from this, and the runner may not export it.
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sm" ]; then
            yes | "$sm" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
            "$sm" --sdk_root="$sdk" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" || true
          else
            echo "no sdkmanager at $sm; using the direct NDK download"
          fi
          # The pinned NDK the tawcroot build requires, whichever route put it there.
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -f "$ndk/source.properties" ]; then
            echo "NDK 28.2.13676358 missing; fetching r28c"
            curl -fL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
            rm -rf /tmp/ndk-unpack && mkdir -p /tmp/ndk-unpack
            unzip -q /tmp/ndk.zip -d /tmp/ndk-unpack
            if ! { mkdir -p "$sdk/ndk" 2>/dev/null && mv /tmp/ndk-unpack/android-ndk-r28c "$ndk" 2>/dev/null; }; then
              sudo mkdir -p "$sdk/ndk"
              sudo mv /tmp/ndk-unpack/android-ndk-r28c "$ndk"
            fi
          fi
          test -f "$ndk/source.properties"
          grep Pkg.Revision "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          ls "$sdk/ndk"

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-downloads-fork-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-fork-

      - name: Runtime (arm64)
        run: |
          set -o pipefail
          runtime/build-runtime.sh arm64-v8a 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: App dependencies
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$GITHUB_WORKSPACE/app/android/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > "$GITHUB_WORKSPACE/app/android/key.properties" <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build side APK
        run: |
          set -o pipefail
          tooling/build-apk.sh --side --no-companion 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          ls -l app/build/app/outputs/flutter-apk/

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          test -f "$apk"

          app_ver="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' app/pubspec.yaml | head -n1)"
          app_ver="${app_ver:-dev}"
          short_sha="$(git rev-parse --short=7 HEAD)"
          head_subject="$(git log -1 --pretty=%s)"
          head_date="$(git log -1 --pretty=%cs)"
          if [ "${#head_subject}" -gt 72 ]; then
            head_summary="${head_subject:0:69}…"
          else
            head_summary="$head_subject"
          fi

          tag="fork-v${app_ver}-b${GITHUB_RUN_NUMBER}-${short_sha}"
          apk_name="dsh-go-fork-v${app_ver}-b${GITHUB_RUN_NUMBER}-${short_sha}-arm64.apk"
          cp "$apk" "$RUNNER_TEMP/$apk_name"
          sha256="$(sha256sum "$RUNNER_TEMP/$apk_name" | awk '{print $1}')"
          apk_size="$(du -h "$RUNNER_TEMP/$apk_name" | awk '{print $1}')"

          # Old releases may exist as GitHub tags that this clone still needs.
          git fetch --tags --force origin 2>/dev/null || true

          # Latest real APK release (skip build-log prereleases / drafts).
          prev_tag="$(gh release list --limit 40 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | select((startswith("fork-log-") or startswith("side-root-shell-log-") or startswith("jvm-log-")) | not)][0] // ""' || true)"

          # Prefer a tag that resolves in this repo; otherwise fall back.
          if [ -n "$prev_tag" ] && ! git rev-parse -q --verify "refs/tags/${prev_tag}^{}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${prev_tag}:refs/tags/${prev_tag}" 2>/dev/null || prev_tag=""
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## 本次构建"
            echo ""
            echo "- **触发提交**：${head_subject} (\`${short_sha}\`，${head_date})"
            echo "- **流水线**：[Run #${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""

            echo "## 相对上一版"
            echo ""
            if [ -n "$prev_tag" ] && git rev-parse -q --verify "refs/tags/${prev_tag}^{}" >/dev/null 2>&1; then
              total="$(git rev-list --count "${prev_tag}..HEAD")"
              non_merge="$(git rev-list --count --no-merges "${prev_tag}..HEAD")"
              if [ "$total" -eq 0 ]; then
                echo "与上一版 \`${prev_tag}\` 指向同一提交（手动重跑或无新代码）。"
              else
                echo "上一版：\`${prev_tag}\` → 本版：\`${short_sha}\`（共 **${total}** 个提交，其中非 merge **${non_merge}**）"
                echo ""
                # Mainline first (fork merges / direct pushes), then a short non-merge sample.
                echo "### 主线提交"
                echo ""
                git log --first-parent -n 20 --pretty=format:'- %s (`%h`)' "${prev_tag}..HEAD"
                echo ""
                echo ""
                if [ "$non_merge" -gt 0 ]; then
                  echo "### 近期非 merge 提交（最多 20 条）"
                  echo ""
                  git log --no-merges -n 20 --pretty=format:'- %s (`%h`)' "${prev_tag}..HEAD"
                  echo ""
                  echo ""
                fi
                echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${short_sha}"
              fi
            else
              echo "未找到可对比的上一版 tag，改为列出最近提交："
              echo ""
              git log --first-parent -n 15 --pretty=format:'- %s (`%h`)'
              echo ""
            fi

            echo ""
            echo "## 构建信息"
            echo ""
            echo "- **版本**：\`v${app_ver}\`（Run \`#${GITHUB_RUN_NUMBER}\`）"
            echo "- **提交**：\`${short_sha}\`（分支：\`${GITHUB_REF_NAME}\`）"
            echo "- **包名**：\`io.github.ccch1mneyyy.dsh_app.test\`（侧装包，可与正式版共存，固定签名可直接覆盖安装）"
            echo "- **APK 文件**：\`${apk_name}\`"
            echo "- **APK 大小**：${apk_size}"
            echo "- **SHA-256**：\`${sha256}\`"
            echo ""
            echo "## Fork 长期特性"
            echo ""
            echo "- \`android_shell\` 支持 root/su，且命令自动放行（不弹「允许一次 / 本轮允许」）"
            echo "- 手机操控默认免确认；清空默认拒绝列表；安装/权限/安全页不再硬拦"
            echo "- 会话权限默认自动允许（前台与后台静默放行）"
            echo "- 新建模型默认支持文本 + 图片"
          } > "$notes_file"

          gh release create "$tag" "$RUNNER_TEMP/$apk_name" \
            --latest \
            --title "DSH Go Fork v${app_ver} · #${GITHUB_RUN_NUMBER} · ${short_sha} — ${head_summary}" \
            --notes-file "$notes_file"

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/failure.md"
          { echo "构建失败。日志尾部："; echo '```'; tail -c 50000 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(no log)"; echo '```'; } > "$body"
          gh release create "$LOG_TAG" --prerelease --title "build log #${GITHUB_RUN_NUMBER}" --notes-file "$body" || true
